<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOME ACSES</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Website Penyimpanan Data Pribadi</h1>
        <p>Unggah file pribadi Anda dengan aman.</p>
    </header>
    <main>
        <form id="uploadForm">
            <input type="file" id="fileInput" multiple>
            <button type="submit">Unggah</button>
        </form>
        <div id="fileList">
            <h2>File yang Diupload:</h2>
            <ul id="files"></ul>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
